version: '3.8'

services:
  # Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fairwork
      POSTGRES_USER: fairwork_user
      POSTGRES_PASSWORD: fairwork_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Backend API
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://fairwork_user:fairwork_password@db:5432/fairwork
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules

  # Frontend
  frontend:
    build: ./frontend
    environment:
      NODE_ENV: development
    depends_on:
      - backend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  postgres_data: