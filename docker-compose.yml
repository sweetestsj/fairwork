services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fairwork
      POSTGRES_PASSWORD: fairwork_dev_password
      POSTGRES_DB: fairwork
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairwork -d fairwork"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fairwork_minio
      MINIO_ROOT_PASSWORD: fairwork_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fairwork:fairwork_dev_password@db:5432/fairwork
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: fairwork_minio
      MINIO_SECRET_KEY: fairwork_minio_password
      MINIO_BUCKET: fairwork-docs
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
